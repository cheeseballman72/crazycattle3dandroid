name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch game source from the 'source' release and overlay touch/Android files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/add
          cp project.godot touch_controls.gd export_presets.cfg /tmp/add/
          gh release download source --pattern 'cc3d-source-main.zip' --dir /tmp
          unzip -q /tmp/cc3d-source-main.zip -d /tmp/src
          cp -a /tmp/src/cc3d-source-main/. .
          cp /tmp/add/* .
          ls | head -50

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Android SDK pieces Godot needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Install Godot 4.4.1 + export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          mv templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Debug keystore + editor settings
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for v in 4 4.4; do
          cat > ~/.config/godot/editor_settings-$v.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
          sed -i 's/^          //' ~/.config/godot/editor_settings-*.tres

      - name: Prepare project
        run: |
          rm -f project.binary
          rm -rf .godot
          # use the readable .gd scripts instead of the compiled .gdc copies
          for f in *.gd.remap; do rm -f "$f" "${f%.gd.remap}.gdc"; done
          godot --headless --path . --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/CrazyCattle3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrazyCattle3D-apk
          path: build/CrazyCattle3D.apk
